<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Transfer List</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // ---- CONFIG ----
    const AGENT = "Rajesh I";
    // Main data endpoint (same deployment as Manoj's page, as requested).
    // WARNING: if this script does not filter by agent on the server, this page will show Manoj's files.
    const MAIN_URL = "https://script.google.com/macros/s/AKfycbwaVxpcAzitM0I0XAObNUFW2fOMA97f5ucYDg0PFkTG4O2CnLN-uJ0xjYnmlDGuuRsx/exec";
    const STAMPS_URL = "https://script.google.com/macros/s/AKfycbw2gYLKIhKTZFxsJyl_g8IuSrYJQ9znTvWzU6_a6Tyud7N8DjeB3DxaKhpLBDlXUAeSFw/exec?agent=" + encodeURIComponent(AGENT);
    const DOCS_URL = "https://script.google.com/macros/s/AKfycbwQuGrQ84jWVagYfRFBFIooBJDmisU1jlw4ekttv5n_7_LDR8BIbpYJ23QLDKrHwp63iA/exec?agent=" + encodeURIComponent(AGENT);

    // Full Office-Remark text per UID, used by Show more / Show less
    const fullRemarks = {};

    // Escape sheet values before putting them into HTML
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    document.addEventListener("DOMContentLoaded", () => {
      fetchMainData();
      fetchStampsData();
      fetchDocumentsData();
    });

    function fetchMainData() {
      fetch(MAIN_URL)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById("cardContainer");
          let html = "";
          data.forEach(item => {
            const uid = esc(item.uid);
            const custRemark = String(item.custRemark ?? "");
            const isLong = custRemark.length > 100;
            fullRemarks[item.uid] = custRemark;

            html += `
              <div class="bg-white shadow-md rounded-xl p-3 mb-3 transition-all hover:shadow-lg">
                <!-- Card Header with UID and Buttons -->
                <div class="flex justify-between items-center mb-2 border-b pb-2">
                  <div class="flex items-center">
                    <span class="bg-blue-100 text-blue-800 font-medium px-2 py-1 rounded text-xs">UID: ${uid}</span>
                    <span class="ml-2 text-base font-bold text-black">${esc(item.district)} | ${esc(item.party)}</span>
                  </div>
                  <div class="flex gap-2">
                    <button data-uid="${uid}" onclick="markAsDone(this.dataset.uid, this)"
                      class="done-btn bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs font-medium transition-all">
                      Mark Done
                    </button>
                    <button data-uid="${uid}" onclick="updateRemark(this.dataset.uid, this)"
                      class="remark-btn bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-xs font-medium transition-all">
                      Update
                    </button>
                  </div>
                </div>

                <!-- Main Content Area -->
                <div class="grid grid-cols-2 gap-x-4 gap-y-2 mb-3">
                  <div class="col-span-1 space-y-1">
                    <div class="flex items-baseline">
                      <p class="text-sm font-semibold text-gray-800 w-24">Designation:</p>
                      <p class="text-sm font-bold text-blue-900">${esc(item.designation)}</p>
                    </div>
                    <div class="flex items-baseline">
                      <p class="text-sm font-semibold text-gray-800 w-24">Loan Type:</p>
                      <p class="text-sm font-bold text-blue-900">${esc(item.loanType)}</p>
                    </div>
                    <div class="flex items-baseline">
                      <p class="text-sm font-semibold text-gray-800 w-24">Mobile:</p>
                      <p class="text-sm font-bold text-blue-900">${esc(item.phone)}</p>
                    </div>
                  </div>
                  <div class="col-span-1">
                    <div class="bg-green-50 p-2 rounded-md">
                      <p class="text-xs font-semibold text-green-800">Loan Eligibility:</p>
                      <p class="text-xs text-green-700">${esc(item.howManyLoan)}</p>
                    </div>
                  </div>
                </div>

                <!-- Remarks Section -->
                <div class="bg-gray-50 p-2 rounded-md mb-3">
                  <div class="mb-2">
                    <p class="text-xs font-semibold text-gray-700 flex items-center">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                      </svg>
                      FO-Remark:
                    </p>
                    <p class="text-xs text-gray-600 ml-4">${esc(item.foRemark)}</p>
                  </div>
                  <div>
                    <p class="text-xs font-semibold text-gray-700 flex items-center">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                      </svg>
                      Office-Remark:
                    </p>
                    <p class="text-xs text-gray-600 ml-4 truncate-text" id="remark-text-${uid}">${esc(isLong ? custRemark.substring(0, 100) + "..." : custRemark)}</p>
                    ${isLong ? `<button data-uid="${uid}" class="text-blue-600 text-xs underline ml-4" onclick="toggleRemark(this.dataset.uid, this)">Show more</button>` : ""}
                  </div>
                </div>

                <!-- Remark Input Area -->
                <div class="mt-1">
                  <div class="relative">
                    <input id="remark-${uid}" type="text" class="w-full border border-gray-300 px-3 py-2 rounded-md text-sm" placeholder="Enter new remark..." />
                    <span id="confirm-${uid}" class="absolute right-2 top-2 text-green-600 text-sm font-semibold hidden">✓</span>
                  </div>
                </div>
              </div>`;
          });
          container.innerHTML = html || `<p class="text-center text-gray-500 text-sm">No files.</p>`;
        })
        .catch(error => {
          console.error("Error fetching main data:", error);
          document.getElementById("cardContainer").innerHTML =
            `<p class="text-center text-red-600 text-sm">Could not load data. Please refresh.</p>`;
        });
    }

    function fetchStampsData() {
      fetch(STAMPS_URL)
        .then(res => res.json())
        .then(data => {
          const table = document.getElementById("stampsTable");
          let html = `
            <thead class="bg-gray-100 text-xs">
              <tr>
                <th class="px-1 py-1 border border-gray-300">District</th>
                <th class="px-1 py-1 border border-gray-300">Party</th>
                <th class="px-1 py-1 border border-gray-300">Stamps</th>
              </tr>
            </thead>
            <tbody>`;
          data.forEach(row => {
            html += `
              <tr class="text-xs text-center">
                <td class="px-1 py-1 border border-gray-300">${esc(row.district)}</td>
                <td class="px-1 py-1 border border-gray-300">${esc(row.name)}</td>
                <td class="px-1 py-1 border border-gray-300">${esc(row.type)}</td>
              </tr>`;
          });
          html += "</tbody>";
          table.innerHTML = html;
        })
        .catch(err => console.error("Error fetching stamp data:", err));
    }

    function fetchDocumentsData() {
      fetch(DOCS_URL)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("documentsContainer");
          container.innerHTML = "";

          const header = document.createElement("div");
          header.className = "flex items-center justify-center mb-2";
          header.innerHTML = `<h2 class="text-sm font-bold text-gray-800">📄 Documents Required</h2>`;
          container.appendChild(header);

          const tableHeader = document.createElement("div");
          tableHeader.className = "bg-white rounded border border-gray-300";
          tableHeader.innerHTML = `
            <div class="grid grid-cols-6 text-xs font-medium bg-gray-50 border-b border-gray-300">
              <div class="p-1 border-r border-gray-300">Party</div>
              <div class="p-1 border-r border-gray-300">District</div>
              <div class="p-1 border-r border-gray-300">Block</div>
              <div class="p-1 border-r border-gray-300">School</div>
              <div class="p-1 border-r border-gray-300">Amount</div>
              <div class="p-1">Docs</div>
            </div>
          `;
          container.appendChild(tableHeader);

          const cardContainer = document.createElement("div");
          cardContainer.className = "bg-white rounded-b border-x border-b border-gray-300";

          data.forEach((row, index) => {
            const card = document.createElement("div");
            card.className = "border-t border-gray-300 first:border-t-0";

            const cardHeader = document.createElement("div");
            cardHeader.className = "grid grid-cols-6 text-xs cursor-pointer hover:bg-gray-50";
            cardHeader.onclick = () => toggleCard(`card-content-${index}`);
            cardHeader.innerHTML = `
              <div class="p-1 border-r border-gray-300 font-medium text-blue-700">${esc(row.party)}</div>
              <div class="p-1 border-r border-gray-300">${esc(row.district)}</div>
              <div class="p-1 border-r border-gray-300 truncate">${esc(row.block)}</div>
              <div class="p-1 border-r border-gray-300 truncate">${esc(row.school)}</div>
              <div class="p-1 border-r border-gray-300">₹${esc(row.loanAmount)}</div>
              <div class="p-1 truncate">${esc(row.remarkDoc)}</div>
            `;

            const cardContent = document.createElement("div");
            cardContent.id = `card-content-${index}`;
            cardContent.className = "hidden bg-gray-50 p-2 text-xs border-t border-gray-200";
            cardContent.innerHTML = `
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <p><span class="font-medium">Party:</span> ${esc(row.party)}</p>
                  <p><span class="font-medium">District:</span> ${esc(row.district)}</p>
                  <p><span class="font-medium">Block:</span> ${esc(row.block)}</p>
                </div>
                <div>
                  <p><span class="font-medium">School:</span> ${esc(row.school)}</p>
                  <p><span class="font-medium">Mobile:</span> ${esc(row.mobile)}</p>
                  <p><span class="font-medium">Loan Date:</span> ${esc(row.loanDate)}</p>
                  <p><span class="font-medium">Loan Amount:</span> ${esc(row.loanAmount)}</p>
                </div>
              </div>

              <p class="mt-1"><span class="font-medium">Required Documents:</span> ${esc(row.remarkDoc)}</p>
              <p class="mt-1"><span class="font-medium">Document Details:</span> ${esc(row.requiredDocs)}</p>
            `;

            card.appendChild(cardHeader);
            card.appendChild(cardContent);
            cardContainer.appendChild(card);
          });

          container.appendChild(cardContainer);
        })
        .catch(err => console.error("Error fetching documents data:", err));
    }

    function toggleCard(id) {
      const content = document.getElementById(id);
      if (content.classList.contains('hidden')) {
        document.querySelectorAll('[id^="card-content-"]').forEach(el => {
          if (el.id !== id) el.classList.add('hidden');
        });
        content.classList.remove('hidden');
      } else {
        content.classList.add('hidden');
      }
    }

    function toggleRemark(uid, button) {
      const span = document.getElementById(`remark-text-${uid}`);
      const fullText = fullRemarks[uid] || "";
      if (button.innerText === "Show more") {
        span.innerText = fullText;
        button.innerText = "Show less";
      } else {
        span.innerText = fullText.substring(0, 100) + "...";
        button.innerText = "Show more";
      }
    }

    function markAsDone(uid, button) {
      button.innerHTML = `<span class="loader"></span>`;
      button.disabled = true;

      fetch(MAIN_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid: uid, action: "done" })
      });

      setTimeout(() => {
        button.innerHTML = "✔ Done";
        button.classList.replace("bg-green-600", "bg-gray-400");
        button.classList.add("cursor-not-allowed");
        button.disabled = true;
      }, 2000);
    }

    function updateRemark(uid, button) {
      const remark = document.getElementById(`remark-${uid}`).value;
      const confirmMessage = document.getElementById(`confirm-${uid}`);
      button.innerHTML = `<span class="loader"></span>`;
      button.disabled = true;

      fetch(MAIN_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ uid: uid, action: "remark", remark: remark })
      });

      setTimeout(() => {
        button.innerHTML = "✔ Updated";
        button.classList.replace("bg-blue-600", "bg-gray-400");
        button.classList.add("cursor-not-allowed");
        button.disabled = true;
        confirmMessage.classList.remove("hidden");
        setTimeout(() => confirmMessage.classList.add("hidden"), 2000);
      }, 2000);
    }
  </script>

  <style>
    .loader {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #3498db;
      width: 16px;
      height: 16px;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .truncate-text {
      display: inline;
      word-break: break-word;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen py-4 px-2">
  <div class="max-w-3xl mx-auto">
    <!-- Two tables side by side on desktop, stacked on mobile -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mb-4">
      <!-- Stamps Table -->
      <div class="bg-white rounded-lg shadow-sm p-2">
        <h2 class="text-sm font-bold text-gray-800 mb-2 text-center">📦 Ye Stamps Office Me Bhejne Hain</h2>
        <div class="overflow-x-auto">
          <table id="stampsTable" class="min-w-full border-collapse text-xs">
            <tr><td class="text-center py-2 text-xs text-gray-500">Loading...</td></tr>
          </table>
        </div>
      </div>

      <!-- Documents Required -->
      <div id="documentsContainer" class="overflow-hidden">
        <div class="text-center py-2 text-xs text-gray-500">Loading...</div>
      </div>
    </div>

    <!-- Main File List -->
    <h1 class="text-xl font-bold text-gray-800 mb-3 text-center">📂 Rajesh I File List</h1>
    <div id="cardContainer">
      <p class="text-center text-gray-500 text-sm">Loading data...</p>
    </div>
  </div>
</body>

</html>
